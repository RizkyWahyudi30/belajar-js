<!-- 
Soal 4.3 — Keranjang Belanja (Gabungan Total)

Tiap <li> produk punya tombol "Tambah ke Keranjang".
Klik tombol itu akan memasukkan produk ke array keranjang 
(mulai dari array kosong, pakai spread operator untuk
menambah item baru, bukan push — latihan spread).

Tampilkan total belanja di <p id="total"> menggunakan 
.reduce(), ter-update otomatis tiap kali item 
ditambahkan.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <button data-kategori="semua">Tampilkan Semua</button>
      <button data-kategori="makanan">Tampilkan Makanan</button>
      <button data-kategori="minuman">Tampilkan Minuman</button>
    </div>

    <table id="table" border="1">
      <thead>
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Harga</th>
          <th>Kategori</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="show-list"></tbody>
    </table>

    <p>List barang</p>
    <ul id="list-barang"></ul>

    <p>Total: <span id="total-harga">0</span></p>

    <script>
      const show = document.getElementById("show-list");
      const all_tombol = document.querySelectorAll("[data-kategori]");

      let keranjang = [];

      const produk = [
        { id: 1, nama: "Kopi", harga: 15000, kategori: "minuman" },
        { id: 2, nama: "Roti", harga: 10000, kategori: "makanan" },
        { id: 3, nama: "Teh", harga: 8000, kategori: "minuman" },
      ];

      function tampilKatalog(arrProd) {
        show.textContent = "";

        arrProd.forEach((prod, index) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${prod.nama}</td>
            <td>${prod.harga}</td>
            <td>${prod.kategori}</td>
            <td>
              <button data-id="${prod.id}">Tambahkan ke Keranjang</button>
            </td>
          `;

          show.append(tr);
        });
      }
      tampilKatalog(produk);

      function tambahKeranjang(id) {
        // ambil produk berdasarkan id
        const produkPilihan = produk.find((prod) => prod.id === id);

        // memasukkan produk ke keranjang
        if (!produkPilihan) return;

        // cari apakah di keranjang sudah ada
        const produkKeranjang = keranjang.find((prod) => prod.id === id);

        if (produkKeranjang) {
          // kalau sudah ada, buat properti baru jumlah yang value nya
          // ditambah 1
          produkKeranjang.jumlah += 1;
        } else {
          keranjang = [...keranjang, { ...produkPilihan, jumlah: 1 }];
        }

        tampilKeranjang();
      }

      function tampilKeranjang() {
        const listBarang = document.getElementById("list-barang");
        const totalHargaProduk = document.getElementById("total-harga");

        listBarang.textContent = "";

        keranjang.forEach((item) => {
          const li = document.createElement("li");
          const harga_per_barang = item.harga * item.jumlah;

          li.textContent = `${item.nama} - Rp. ${item.harga} [${item.jumlah}] = Rp. ${harga_per_barang}`;
          listBarang.append(li);
        });

        const total = totalHarga(keranjang);
        totalHargaProduk.textContent = total;
      }

      function totalHarga(arrProd) {
        return arrProd.reduce((sum, item) => sum + item.harga * item.jumlah, 0);
      }

      function filterKategori(arrProd, kategori) {
        // jika btn 'semua', maka di skip
        if (kategori === "semua") {
          return arrProd;
        }

        return arrProd.filter((prod) => prod.kategori === kategori);
      }

      all_tombol.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const kategori = e.target.dataset.kategori;

          console.log("Kategori yang di click:", kategori);

          const filterProduk = filterKategori(produk, kategori);
          tampilKatalog(filterProduk);
        });
      });

      // button untuk tambah keranjang
      show.addEventListener("click", (e) => {
        if (e.target.dataset.id) {
          const idProduk = Number(e.target.dataset.id);

          tambahKeranjang(idProduk);
        }
      });
    </script>
  </body>
</html>
