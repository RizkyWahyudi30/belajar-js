<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>List Barang</h1>

    <button id="btn-semua">Semua</button>
    <button id="btn-makanan">Makanan</button>
    <button id="btn-minuman">Minuman</button>

    <table id="table" border="1">
      <thead>
        <tr>
          <th id="no">No</th>
          <th id="nama">Nama</th>
          <th id="harga">Harga</th>
          <th id="kategori">Kategori</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="show-list"></tbody>
    </table>

    <p>List keranjang:</p>
    <ul id="list-keranjang"></ul>
    <p>Total: <span id="total-harga">0</span></p>

    <script type="text/javascript">
      const semua = document.getElementById("btn-semua");
      const btn_makanan = document.getElementById("btn-makanan");
      const btn_minuman = document.getElementById("btn-minuman");
      const show = document.getElementById("show-list");

      const produk = [
        { id: 1, nama: "Kopi", harga: 15000, kategori: "minuman" },
        { id: 2, nama: "Roti", harga: 10000, kategori: "makanan" },
        { id: 3, nama: "Teh", harga: 8000, kategori: "minuman" },
      ];

      const keranjang = [];

      function tambahKeranjang(id) {
        // ambil produk berdasarkan id
        const produk_pilihan = produk.find((prod) => prod.id === id);

        // memasukkan produk ke array keranjang
        if (produk_pilihan) {
          const produk_keranjang = keranjang.find((item) => item.id === id);

          if (produk_keranjang) {
            // Jika data sudah ada, hanya masukkan harga
            produk_keranjang.jumlah += 1;
          } else {
            // jika belum ada, masukkan objek dan properti jumlah
            keranjang.push({
              ...produk_pilihan,
              jumlah: 1,
            });
          }

          // tampilkan keranjang di HTML
          updateKeranjang();
        }
      }

      function updateKeranjang() {
        const list_keranjang = document.getElementById("list-keranjang");
        const total_harga_produk = document.getElementById("total-harga");

        list_keranjang.innerHTML = "";

        keranjang.forEach((item) => {
          const li = document.createElement("li");

          // subtotal barang (harga * jumlah)
          const subtotal_harga = item.harga * item.jumlah;

          li.textContent = `${item.nama} - Rp. ${item.harga} [${item.jumlah}]`;
          list_keranjang.append(li);
        });

        const total = totalHarga(keranjang);
        total_harga_produk.textContent = total;
      }

      function totalHarga(produk) {
        return produk.reduce((sum, prd) => sum + prd.harga * prd.jumlah, 0);
      }

      function showInHTML(arrProd) {
        show.textContent = "";

        arrProd.forEach((prod, index) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${prod.nama}</td>
            <td>Rp. ${prod.harga}</td>
            <td>${prod.kategori}</td>
            <td>
              <button onclick="tambahKeranjang(${prod.id})">Tambah ke Keranjang</button>
            </td>
          `;

          show.append(tr);
        });
      }

      showInHTML(produk);

      semua.addEventListener("click", () => {
        showInHTML(produk);
      });

      btn_makanan.addEventListener("click", () => {
        const filter_prod = produk.filter(
          (prod) => prod.kategori === "makanan",
        );

        showInHTML(filter_prod);
      });

      btn_minuman.addEventListener("click", () => {
        const filter_prod = produk.filter(
          (prod) => prod.kategori === "minuman",
        );

        showInHTML(filter_prod);
      });
    </script>
  </body>
</html>
