<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>List Barang</h1>

    <button id="btn-semua">Semua</button>
    <button id="btn-makanan">Makanan</button>
    <button id="btn-minuman">Minuman</button>

    <table id="table" border="1">
      <thead>
        <tr>
          <th id="no">No</th>
          <th id="nama">Nama</th>
          <th id="harga">Harga</th>
          <th id="kategori">Kategori</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="show-list"></tbody>
    </table>

    <script type="text/javascript">
      const semua = document.getElementById("btn-semua");
      const btn_makanan = document.getElementById("btn-makanan");
      const btn_minuman = document.getElementById("btn-minuman");
      const show = document.getElementById("show-list");

      const produk = [
        { id: 1, nama: "Kopi", harga: 15000, kategori: "minuman" },
        { id: 2, nama: "Roti", harga: 10000, kategori: "makanan" },
        { id: 3, nama: "Teh", harga: 8000, kategori: "minuman" },
      ];

      const convert_prod = produk.map((prod) => {
        return {
          nama: prod.nama,
          harga: prod.harga,
          kategori: prod.kategori,
        };
      });

      function showInHTML(arrProd) {
        show.textContent = "";

        arrProd.forEach((prod, index) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${prod.nama}</td>
            <td>Rp. ${prod.harga}</td>
            <td>${prod.kategori}</td>
            <td>
              <button>Tambah ke Keranjang</button>  
            </td>
          `;

          show.append(tr);
        });
      }

      showInHTML(convert_prod);

      semua.addEventListener("click", () => {
        showInHTML(convert_prod);
      });

      btn_makanan.addEventListener("click", () => {
        const filter_prod = convert_prod.filter((prod) => {
          prod.kategori === "makanan";
        });

        showInHTML(filter_prod);
      });

      btn_minuman.addEventListener("click", () => {
        const filter_prod = convert_prod.filter((prod) => {
          prod.kategori === "minuman";
        });

        showInHTML(filter_prod);
      });
    </script>
  </body>
</html>
