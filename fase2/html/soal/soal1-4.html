<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal 1.4 — Traversal & Hapus</title>
  </head>
  <body>
    <!-- 
    Lanjutan dari 1.3: setiap <li> yang dibuat harus punya tombol 
    kecil "x" di dalamnya. Saat "x" diklik, hapus <li> induknya 
    (pakai traversal parentElement atau closest).
    -->
    <ul id="daftar"></ul>

    <input type="text" id="input-item" />
    <button id="btn-tambah">Tambah</button>

    <script>
      const ul = document.getElementById("daftar");
      const input = document.getElementById("input-item");
      const btn = document.getElementById("btn-tambah");

      btn.addEventListener("click", function () {
        const li = document.createElement("li");
        const btnHapus = document.createElement("button");

        if (input.value.trim() === "") {
          alert("Tidak boleh input kosong");
          input.value = "";
          return;
        }

        li.textContent = input.value;
        btnHapus.textContent = "Hapus";
        li.append(btnHapus);
        ul.append(li);
        input.value = "";

        // btnHapus.addEventListener("click", function () {
        //   li.remove();
        // });

        // - coba dengan DOM Traversal
        // btnHapus.addEventListener("click", function () {
        //   this.parentElement.remove(); // 'this' = btnHapus, parent-nya = li
        // });

        // - menggunakan closest versi lebih robust
        btnHapus.addEventListener("click", function (e) {
          e.target.closest("li").remove();
        });
      });
    </script>
  </body>
</html>
